name: LandlordHours
options:
  bundleIdPrefix: com.openclaw
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    GENERATE_INFOPLIST_FILE: NO
    MARKETING_VERSION: "1.0.6"
    CURRENT_PROJECT_VERSION: "202608260402"

packages:
  LucideIcons:
    url: https://github.com/JakubMazur/lucide-icons-swift.git
    from: 0.575.0
  PostHog:
    url: https://github.com/PostHog/posthog-ios
    from: "3.66.1"
  # RevenueCat (observer-mode monetization tracking, 2026-08-26): wired ANALYTICS/OBSERVER MODE
  # ONLY — `purchasesAreCompletedBy: .myApp` — so the existing StoreKit 2 purchase path in
  # `Sources/Services/SubscriptionManager.swift` stays untouched; RC only observes transactions
  # for its dashboards. See `Sources/Services/LandlordPurchases.swift` for the feature/key gates
  # (ships dark until a real key replaces REVENUECAT_API_KEY below). Pinned to the exact version
  # resolved by the LensWords / Bee Buddy reference apps (Package.resolved), not a floating range.
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios-spm.git
    exactVersion: "5.86.0"

targets:
  LandlordHours:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes:
          - "**/Info.plist"
          - "Widget/**"
      - path: Assets.xcassets
    dependencies:
      - package: LucideIcons
      - package: PostHog
      - package: RevenueCat
        product: RevenueCat
    entitlements:
      path: LandlordHours.entitlements
      properties:
        # App Group: shared container for extension → app hand-off (one file per item; see
        # Sources/Services/Capture/AppGroup.swift). No extension targets until WP6a/WP7 start.
        com.apple.security.application-groups:
          - group.com.openclaw.landlordhours
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.openclaw.landlordhours
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)com.openclaw.landlordhours
        com.apple.developer.applesignin:
          - Default
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.openclaw.landlordhours
        DEVELOPMENT_TEAM: G68NLC3DA3
        # Info.plist is hand-maintained (GENERATE_INFOPLIST_FILE: NO). 2.0 adds
        # BGTaskSchedulerPermittedIdentifiers there: com.openclaw.landlordhours.capture.refresh and
        # .capture.backfill (mirrored in BackgroundTaskIdentifiers, kept in step by a unit test).
        # The matching UIBackgroundModes (fetch/processing) are added with the scheduler (WP4).
        INFOPLIST_FILE: Sources/App/Info.plist
        SWIFT_EMIT_LOC_STRINGS: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # RevenueCat public SDK key (observer mode). Real production `appl_` public SDK key from
        # app.revenuecat.com (activated 2026-08-26) — used in BOTH Debug and Release: observer mode
        # just records whatever StoreKit transactions the app actually makes, and RC itself
        # segregates Debug/sandbox purchases from production ones in its dashboard.
        # `LandlordPurchases.swift` still treats the placeholder string
        # (`REPLACE_WITH_REVENUECAT_PUBLIC_SDK_KEY`) and any empty value as "no key" and no-ops on
        # top of its own `isEnabled` gate — that guard path stays in place and is unit-tested even
        # though a real key ships today. Never a secret worth encrypting — RC's own docs describe
        # this as a public, client-embeddable key (same category as the PostHog key already
        # inlined in Analytics.swift).
        REVENUECAT_API_KEY: "appl_nekSXCuphljAxqntEkeFUyDJFrY"
  LandlordHoursTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
      - path: LandlordHours.storekit
        buildPhase: resources
    dependencies:
      - target: LandlordHours
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.openclaw.landlordhours.tests
        DEVELOPMENT_TEAM: G68NLC3DA3
        GENERATE_INFOPLIST_FILE: YES
  LandlordHoursUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
      # SKTestSession(configurationFileNamed:) resets StoreKit test purchases between UI tests.
      - path: LandlordHours.storekit
        buildPhase: resources
    dependencies:
      - target: LandlordHours
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.openclaw.landlordhours.uitests
        DEVELOPMENT_TEAM: G68NLC3DA3
        TEST_TARGET_NAME: LandlordHours
        GENERATE_INFOPLIST_FILE: YES

schemes:
  LandlordHours:
    shared: true
    build:
      targets:
        LandlordHours: all
    # Local StoreKit config so Debug runs and free-user UI journeys load the real
    # $29.99 Pro product and reach the purchase sheet without App Store Connect.
    run:
      storeKitConfiguration: LandlordHours.storekit
    test:
      targets:
        - LandlordHoursTests
        - LandlordHoursUITests
