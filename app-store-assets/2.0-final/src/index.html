<!doctype html><html><head><meta charset="utf-8"><title>LandlordHours 2.0 store set</title>
<style>
@font-face{font-family:"Fraunces";src:url("Fraunces.ttf");font-weight:100 900;}
:root{--blue:#1E3FA6;--ink:#121B33;--canvas:#EEF2FA;--cyan:#8FD3FF;}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:var(--canvas)}
.poster{position:relative;width:100vw;height:100vh;overflow:hidden;
 background:
  linear-gradient(rgba(143,211,255,.22) 1px,transparent 1px) 0 0/6vw 6vw,
  linear-gradient(90deg,rgba(143,211,255,.22) 1px,transparent 1px) 0 0/6vw 6vw,
  linear-gradient(180deg,#F8FAFE 0%,#E3E9FA 100%);}
.head{position:absolute;left:0;right:0;top:var(--ht,6.2%);text-align:center;padding:0 6vw;z-index:4}
h1{font-family:"Fraunces",serif;font-variation-settings:"opsz" 144,"SOFT" 50;font-weight:560;color:var(--ink);
 font-size:var(--fs,10.8vw);line-height:1.04;letter-spacing:-.01em;text-wrap:balance}
h1 .hl{color:var(--blue)}
.device{position:absolute;left:50%;transform:translateX(-50%);width:var(--dw,89vw);top:var(--dt,24.5%);
 border-radius:var(--dr,8.6vw);overflow:hidden;z-index:3;
 box-shadow:0 0 0 .25vw rgba(255,255,255,.9),0 5vw 9vw rgba(30,63,166,.28),0 1.8vw 3.6vw rgba(30,63,166,.18)}
.device img{display:block;width:100%}
.float{box-shadow:none;border-radius:0;overflow:visible;background:none}.float img{filter:drop-shadow(0 2.2vw 3.2vw rgba(30,63,166,.35))}
.hidden{display:none!important}
</style></head><body>
<div id="root"></div>
<script>
const q=new URLSearchParams(location.search);const mode=q.get('m')||'phone';const id=q.get('p');
const P=JSON.parse(decodeURIComponent(q.get('d')));
const p=P;
const ipad=mode==='ipad';
const r=document.getElementById('root');
const vars=ipad?`--fs:6.4vw;--ht:5%;--dw:${p.dwPad||76}vw;--dt:${p.dtPad||19}%;--dr:3.4vw`:`--fs:${p.fs||10.8}vw;--ht:6.2%;--dw:${p.dw||89}vw;--dt:${p.dt||24.5}%`;
r.innerHTML=`<section class="poster" style="${vars}"><div class="head"><h1>${p.h}</h1></div><div class="device ${p.float?'float':''}"><img src="${p.img}"></div></section>`;
</script></body></html>
