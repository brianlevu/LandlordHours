<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" width="1200" height="220" color="#121B33">
  <title>LandlordHours wordmark, light: Fraunces 600, "Hours" in blueprint blue, drafting dimension in draftingInk. Inline it and set color/--lh-action for the theme; wordmark-dark.svg is the fixed dark file.</title>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,600,50&amp;display=swap');
      .w { font-family: 'Fraunces', 'New York', 'Iowan Old Style', Georgia, serif; font-weight: 600; font-size: 150px; font-variation-settings: 'opsz' 144, 'SOFT' 50; letter-spacing: -0.015em; }
      .dim { stroke: var(--lh-drafting-ink, #2369B5); stroke-width: 4; fill: none; }
      .lab { font-family: 'SF Mono', ui-monospace, Menlo, monospace; font-size: 20px; letter-spacing: 0.08em; fill: var(--lh-drafting-ink, #2369B5); }
    </style>
  </defs>
  <text class="w" x="40" y="150" fill="currentColor">Landlord<tspan fill="var(--lh-action, #1E3FA6)">Hours</tspan></text>
  <g class="dim">
    <path d="M746 190 L1118 190" />
    <path d="M746 178 L746 202 M1118 178 L1118 202" />
  </g>
  <text class="lab" x="932" y="214" text-anchor="middle">750 h</text>
</svg>
