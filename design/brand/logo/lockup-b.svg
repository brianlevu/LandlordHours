<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 320" width="1500" height="320" color="#121B33">
  <title>LandlordHours lockup: mark B + wordmark, horizontal</title>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,600,50&amp;display=swap');
      .w { font-family: 'Fraunces', 'New York', 'Iowan Old Style', Georgia, serif; font-weight: 600; font-size: 150px; font-variation-settings: 'opsz' 144, 'SOFT' 50; letter-spacing: -0.015em; }
    </style>
  </defs>
  <!-- mark on a blueprint tile, 280 px, corner radius 22% -->
  <g transform="translate(20 20)">
    <rect width="280" height="280" rx="62" fill="#1E3FA6" />
    <g transform="scale(0.2734) translate(10 -11.5)">
      <path d="M512 232 L836 486" stroke="#8FD3FF" stroke-width="26" stroke-linecap="round" fill="none" />
      <path d="M770 436 L770 700" stroke="#8FD3FF" stroke-width="26" stroke-linecap="round" fill="none" />
      <rect x="588" y="540" width="120" height="96" rx="12" stroke="#8FD3FF" stroke-width="26" fill="none" />
      <rect x="222" y="808" width="580" height="40" rx="10" fill="#F4EFE6" />
      <rect x="250" y="470" width="262" height="342" fill="#F4EFE6" />
      <rect x="512" y="690" width="258" height="122" fill="#F4EFE6" />
      <path d="M512 232 L188 486" stroke="#C8553D" stroke-width="66" stroke-linecap="round" fill="none" />
      <path d="M382 683 a47 47 0 0 1 94 0 V812 H382 Z" fill="#E0A458" />
    </g>
  </g>
  <text class="w" x="360" y="212" fill="currentColor">Landlord<tspan fill="var(--lh-action, #1E3FA6)">Hours</tspan></text>
</svg>
